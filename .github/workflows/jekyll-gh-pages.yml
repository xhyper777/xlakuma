<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Saki Naka 3D Map | Mumbai</title>
  
  <!-- MapLibre GL CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Floating Info Card */
    .card {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      max-width: 280px;
      z-index: 10;
    }
    .card h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: #111;
    }
    .card p {
      margin: 4px 0;
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      background: #007aff;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
    }

    /* Custom Popup */
    .maplibregl-popup-content {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Info Overlay -->
  <div class="card">
    <h2>📍 Saki Naka, Mumbai</h2>
    <span class="badge">3D View</span>
    <p>• <b>Rotate & Tilt:</b> Right-click + drag (or 2 fingers on mobile)</p>
    <p>• <b>Zoom:</b> Mouse scroll / pinch</p>
  </div>

  <div id="map"></div>

  <script>
    // Saki Naka Coordinates: [Longitude, Latitude]
    const SAKI_NAKA = [72.8878, 19.1026];

    // Initialize 3D Map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty', // Free vector tiles
      center: SAKI_NAKA,
      zoom: 16.5,
      pitch: 62,      // 3D tilt
      bearing: -25,   // Rotation angle
      antialias: true
    });

    // Add navigation & compass controls
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.FullscreenControl(), 'top-right');

    // Add Marker for Saki Naka Metro Station / Junction
    const marker = new maplibregl.Marker({ color: '#ff3b30' })
      .setLngLat(SAKI_NAKA)
      .setPopup(
        new maplibregl.Popup({ offset: 25 }).setHTML(
          '<strong>Saki Naka Junction</strong><br>Metro Line 1 (Blue Line)<br>Andheri East, Mumbai'
        )
      )
      .addTo(map);

    // Open popup by default
    marker.togglePopup();

    // Render 3D Extruded Buildings
    map.on('load', () => {
      const layers = map.getStyle().layers;
      const labelLayerId = layers.find(
        (l) => l.type === 'symbol' && l.layout && l.layout['text-field']
      )?.id;

      map.addLayer(
        {
          id: '3d-buildings',
          source: 'openmaptiles',
          'source-layer': 'building',
          type: 'fill-extrusion',
          minzoom: 14,
          paint: {
            'fill-extrusion-color': '#d1d5db',
            'fill-extrusion-height': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14,
              0,
              15.05,
              ['coalesce', ['get', 'render_height'], 18]
            ],
            'fill-extrusion-base': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14,
              0,
              15.05,
              ['coalesce', ['get', 'render_min_height'], 0]
            ],
            'fill-extrusion-opacity': 0.8
          }
        },
        labelLayerId
      );
    });
  </script>
</body>
</html>
